<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel Admin Undangan</title>
<style>
:root{--g:#2f4a3c;--gd:#1d3027;--gold:#b8935a;--ivory:#fbf8f1;--sagel:#e7ede4;--ink:#38413b;--mut:#7b857d;--line:#e4dccb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:14px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:Georgia,serif;font-size:22px;color:var(--g);font-weight:600}
.top small{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 14px rgba(47,74,60,.05)}
input[type=text],input[type=password],input[type=tel],textarea{width:100%;border:1px solid #d8cfbb;border-radius:10px;padding:10px 12px;font:inherit;background:var(--ivory);outline:0}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:110px;resize:vertical}
label.l{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
.b{border:0;border-radius:10px;padding:9px 14px;font:600 13px inherit;background:var(--g);color:#fff;cursor:pointer}
.b.o{background:#fff;color:var(--g);border:1px solid var(--g)}
.b.r{background:#fff;color:#a8483b;border:1px solid #e3b9b2}
.b.wa{background:#1fa855}
.b.s{padding:6px 10px;font-size:12px}
.b:disabled{opacity:.5}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st div{background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center;padding:10px 4px}
.st b{display:block;font:600 26px Georgia,serif;color:var(--g)}
.st span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;font:600 13px inherit;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:flex;gap:8px}.row>*{flex:1}
.g{border-top:1px solid var(--line);padding:12px 0}.g:first-child{border-top:0}
.g .n{font-weight:600;overflow-wrap:anywhere}
.g .m{font-size:12px;color:var(--mut)}
.g .a{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tg{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:4px;vertical-align:middle}
.tg.ok{background:#dcf1e3;color:#177a3e}.tg.no{background:#fdebd0;color:#9a5b0d}.tg.u{background:var(--sagel);color:var(--g)}
.tg.t{background:#f5e0dc;color:#9a4a3d}.tg.r{background:#f4ecd2;color:#8a6d22}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw input{width:42px;height:22px;accent-color:var(--g)}
.msg{font-size:13px;margin-top:8px;color:#a8483b}
.hide{display:none!important}
.prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f2f2f2}
.prev img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover;background:#ccc}
.prev div{padding:8px 12px;font-size:12px}.prev b{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="w">
 <div class="top"><h1>Panel Admin</h1><small id="jd"></small></div>

 <div id="vInfo" class="card hide"></div>

 <form id="vLogin" class="card hide">
  <label class="l" for="pw">Kata sandi admin</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <button class="b" style="margin-top:12px;width:100%" id="bm">Masuk</button>
  <div class="msg" id="lm"></div>
 </form>

 <div id="vApp" class="hide">
  <div class="st"><div><b id="sT">0</b><span>Tamu</span></div><div><b id="sK">0</b><span>Sudah dikirim</span></div><div><b id="sU">0</b><span>Ucapan</span></div></div>
  <div class="tabs"><button data-t="tamu" class="on">Tamu</button><button data-t="ucapan">Ucapan</button><button data-t="set">Pengaturan</button></div>

  <div id="pTamu">
   <div class="card">
    <label class="l" for="tn" style="margin-top:0">Nama tamu</label>
    <input type="text" id="tn" maxlength="40" placeholder="Contoh: Bapak Andi">
    <label class="l" for="tw">No. WhatsApp (boleh kosong)</label>
    <input type="tel" id="tw" placeholder="0812xxxxxxx">
    <div class="row" style="margin-top:12px"><button class="b" id="tAdd">Tambah</button><button class="b o" id="tBulkB">Tambah banyak sekaligus</button></div>
    <div id="bulk" class="hide">
     <label class="l">Satu tamu per baris. Nomor WA setelah koma.</label>
     <textarea id="bt" placeholder="Bapak Andi, 0812xxxx&#10;Ibu Rina&#10;Keluarga Besar Hendra, 0857xxxx"></textarea>
     <button class="b" id="bSave" style="margin-top:8px;width:100%">Simpan semua</button>
    </div>
   </div>
   <input type="text" id="cari" placeholder="Cari nama tamu...">
   <div class="card" id="lTamu"></div>
  </div>

  <div id="pUcapan" class="hide"><div class="card" id="sumU"></div><div class="card" id="lUcapan"></div></div>

  <div id="pSet" class="hide">
   <div class="card">
    <div class="sw"><span>Tampilkan ucapan ke tamu lain</span><input type="checkbox" id="cUp"></div>
    <div class="sw" id="rTm"><span>Tampilkan "Turut Mengundang"</span><input type="checkbox" id="cTm"></div>
    <div class="sw" id="rR1"><span>Tampilkan rekening 1</span><input type="checkbox" id="cR1"></div>
    <div class="sw" id="rR2"><span>Tampilkan rekening 2</span><input type="checkbox" id="cR2"></div>
   </div>
   <div class="card">
    <label class="l" for="ps" style="margin-top:0">Pesan undangan</label>
    <textarea id="ps" style="min-height:260px"></textarea>
    <small style="color:var(--mut)">Kata dalam kurung kurawal diganti otomatis: {nama} {pria} {wanita} {mempelai} {tanggal} {akad} {resepsi} {link}. Jangan hapus tanda kurung kurawalnya.</small>
    <div style="margin-top:8px"><button class="b o s" id="psR">Kembalikan bawaan</button></div>
   </div>
   <div class="card"><label class="l" style="margin-top:0">Tampilan link saat dikirim</label><div class="prev"><img id="pvI" alt=""><div><b id="pvT"></b><span id="pvD"></span></div></div></div>
   <button class="b" id="setS" style="width:100%">Simpan pengaturan</button>
   <button class="b r" id="out" style="width:100%;margin-top:10px">Keluar</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script src="data/data-undangan.js"></script>
<script src="js/fb.js"></script>
<script>
(function(){
'use strict';
var D=window.DATA||{},FB=window.FB;
var $=function(s){return document.querySelector(s)};
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var pr=D.pria||{},wn=D.wanita||{},ZONA=D.zona||'WIB';
var NAMA=(pr.panggilan||'')+' & '+(wn.panggilan||'');
$('#jd').textContent='Undangan '+NAMA;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function tgl(s){var p=String(s||'').split('-');if(p.length<3)return '';var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]}
function jam(e){return e.jamMulai.replace(':','.')+(e.jamSelesai?' - '+e.jamSelesai.replace(':','.'):' - selesai')+' '+ZONA}
function ev(e,j){return e?j+'\n'+tgl(e.tanggal)+'\n'+jam(e)+'\n'+e.tempat+', '+e.alamat:''}
function salin(t,m){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){toast(m)});else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(m)}}

var DEFAULT="Assalamu'alaikum Wr. Wb.\n\nKepada Yth.\n{nama}\n\nDengan memohon rahmat dan ridho Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di pernikahan kami:\n\n*{mempelai}*\n\n{akad}\n\n{resepsi}\n\nBuka undangan digital kami di:\n{link}\n\nMerupakan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\nWassalamu'alaikum Wr. Wb.\nHormat kami,\n{mempelai}";
var S={tamu:[],ucapan:[],set:{}};
var BASEURL=(D.siteUrl&&D.siteUrl.indexOf('...')<0?D.siteUrl:location.href.replace(/admin\.html.*$/,''));
if(BASEURL.slice(-1)!=='/')BASEURL+='/';
function link(n){return BASEURL+'?to='+encodeURIComponent(n)}
function pesan(n){
  var t=S.set.pesan||DEFAULT,akad=D.akad||D.resepsi||{};
  var v={nama:n,pria:pr.nama||'',wanita:wn.nama||'',mempelai:NAMA,tanggal:tgl(akad.tanggal),akad:ev(D.akad,'Akad Nikah'),resepsi:ev(D.resepsi,'Resepsi'),link:link(n)};
  return t.replace(/\{(\w+)\}/g,function(m,k){return k in v?v[k]:m}).replace(/\n{3,}/g,'\n\n');
}
function nomor(s){s=String(s||'').replace(/\D/g,'');if(!s)return '';if(s.indexOf('62')===0)return s;if(s[0]==='0')return '62'+s.slice(1);if(s[0]==='8')return '62'+s;return s}

function view(v){['vInfo','vLogin','vApp'].forEach(function(i){$('#'+i).classList.toggle('hide',i!==v)})}
function info(h){$('#vInfo').innerHTML=h;view('vInfo')}
function gagal(e){
  if(e&&(e.status===401||e.status===403)){FB.logout();view('vLogin');$('#lm').textContent='Tidak diizinkan. Masuk ulang.';return}
  toast('Terjadi kesalahan: '+(e&&e.message||e));
}

if(!FB||!FB.aktif){info('<b>Belum disambungkan</b><br>Pengaturan Firebase belum diisi (apiKey, projectId, atau kode di data/data-undangan.js). Hubungi pembuat undangan.');}
else if(FB.sudahLogin())muat();else view('vLogin');

$('#vLogin').onsubmit=function(e){
  e.preventDefault();var b=$('#bm');b.disabled=true;$('#lm').textContent='';
  FB.login($('#pw').value).then(function(){$('#pw').value='';muat()}).catch(function(er){$('#lm').textContent=er.pesan||'Gagal masuk'}).then(function(){b.disabled=false});
};

function muat(){
  view('vApp');
  FB.pengaturan().then(function(p){
    if(p){S.set=p}else{var d={ucapanPublik:D.ucapanPublik!==false,turutTampil:!!D.turutMengundangTampil,rekening1:true,rekening2:true,pesan:''};S.set=d;FB.simpanPengaturan(d).catch(function(){})}
    isiSet();
  }).catch(gagal);
  Promise.all([FB.tamuDaftar(),FB.daftarUcapan(true)]).then(function(r){S.tamu=r[0];S.ucapan=r[1];render()}).catch(gagal);
}

function render(){
  $('#sT').textContent=S.tamu.length;$('#sK').textContent=S.tamu.filter(function(t){return t.terkirim}).length;$('#sU').textContent=S.ucapan.length;
  var sudah={};S.ucapan.forEach(function(u){sudah[String(u.nama).trim().toLowerCase()]=1});
  var q=$('#cari').value.trim().toLowerCase();
  var L=S.tamu.filter(function(t){return !q||t.nama.toLowerCase().indexOf(q)>-1});
  $('#lTamu').innerHTML=L.length?L.map(function(t){
    return '<div class="g"><div class="n">'+esc(t.nama)+' <span class="tg '+(t.terkirim?'ok':'no')+'">'+(t.terkirim?'Terkirim':'Belum dikirim')+'</span>'+(sudah[t.nama.trim().toLowerCase()]?' <span class="tg u">Sudah mengucapkan</span>':'')+'</div>'+
    '<div class="m">'+(t.wa?esc(t.wa):'Tanpa nomor WhatsApp')+'</div><div class="a">'+
    '<button class="b wa s" data-a="wa" data-id="'+t.id+'">'+(t.wa?'Kirim WhatsApp':'Pilih kontak WhatsApp')+'</button>'+
    '<button class="b o s" data-a="pesan" data-id="'+t.id+'">Salin pesan</button><button class="b o s" data-a="link" data-id="'+t.id+'">Salin link</button>'+
    '<button class="b r s" data-a="hapus" data-id="'+t.id+'">Hapus</button></div></div>'}).join(''):'<div class="m">Belum ada tamu.</div>';
  var c={hadir:0,tidak:0,ragu:0};S.ucapan.forEach(function(u){if(c[u.hadir]!==undefined)c[u.hadir]++});
  $('#sumU').innerHTML='<b>Kehadiran:</b> <span class="tg ok">Hadir '+c.hadir+'</span> <span class="tg t">Belum bisa hadir '+c.tidak+'</span> <span class="tg r">Masih ragu '+c.ragu+'</span>';
  var HD={hadir:['Hadir','ok'],tidak:['Belum bisa hadir','t'],ragu:['Masih ragu','r']};
  $('#lUcapan').innerHTML=S.ucapan.length?S.ucapan.map(function(u){var h=HD[u.hadir]||HD.hadir;
    return '<div class="g"><div class="n">'+esc(u.nama)+' <span class="tg '+h[1]+'">'+h[0]+'</span></div><div style="white-space:pre-line;overflow-wrap:anywhere">'+esc(u.isi)+'</div><div class="m">'+(u.waktu?u.waktu.toLocaleString('id-ID'):'')+'</div><div class="a"><button class="b r s" data-a="hu" data-id="'+u.id+'">Hapus</button></div></div>'}).join(''):'<div class="m">Belum ada ucapan.</div>';
}
$('#cari').oninput=render;

document.addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var id=b.dataset.id,a=b.dataset.a,t=S.tamu.filter(function(x){return x.id===id})[0];
  if(a==='wa'&&t){
    var n=nomor(t.wa);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(pesan(t.nama)),'_blank');
    FB.tamuUbah(id,{terkirim:true}).then(function(){t.terkirim=true;render()}).catch(gagal);
  }else if(a==='pesan'&&t)salin(pesan(t.nama),'Pesan tersalin');
  else if(a==='link'&&t)salin(link(t.nama),'Link tersalin');
  else if(a==='hapus'&&t){if(confirm('Hapus tamu "'+t.nama+'"?'))FB.tamuHapus(id).then(function(){S.tamu=S.tamu.filter(function(x){return x.id!==id});render()}).catch(gagal)}
  else if(a==='hu'){if(confirm('Hapus ucapan ini?'))FB.ucapanHapus(id).then(function(){S.ucapan=S.ucapan.filter(function(x){return x.id!==id});render()}).catch(gagal)}
});

$('#tAdd').onclick=function(){
  var n=$('#tn').value.trim().slice(0,40);if(!n){toast('Isi nama tamu');return}
  if(S.tamu.some(function(t){return t.nama.toLowerCase()===n.toLowerCase()})){toast('Nama sudah ada di daftar');return}
  FB.tamuTambah({nama:n,wa:$('#tw').value.trim()}).then(function(t){S.tamu.push(t);$('#tn').value='';$('#tw').value='';render();toast('Tamu ditambahkan')}).catch(gagal);
};
$('#tBulkB').onclick=function(){$('#bulk').classList.toggle('hide')};
$('#bSave').onclick=function(){
  var have={};S.tamu.forEach(function(t){have[t.nama.toLowerCase()]=1});
  var L=[];$('#bt').value.split('\n').forEach(function(r){var p=r.split(',');var n=p[0].trim().slice(0,40);if(n&&!have[n.toLowerCase()]){have[n.toLowerCase()]=1;L.push({nama:n,wa:(p[1]||'').trim()})}});
  if(!L.length){toast('Tidak ada tamu baru');return}
  var b=$('#bSave');b.disabled=true;
  Promise.all(L.map(function(x){return FB.tamuTambah(x)})).then(function(r){S.tamu=S.tamu.concat(r);$('#bt').value='';render();toast(r.length+' tamu disimpan')}).catch(gagal).then(function(){b.disabled=false});
};

document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  $('#pTamu').classList.toggle('hide',b.dataset.t!=='tamu');$('#pUcapan').classList.toggle('hide',b.dataset.t!=='ucapan');$('#pSet').classList.toggle('hide',b.dataset.t!=='set');
}});

function isiSet(){
  $('#cUp').checked=S.set.ucapanPublik!==false;$('#cTm').checked=!!S.set.turutTampil;$('#cR1').checked=S.set.rekening1!==false;$('#cR2').checked=S.set.rekening2!==false;
  $('#ps').value=S.set.pesan||DEFAULT;
  $('#rTm').classList.toggle('hide',!(D.turutMengundang&&D.turutMengundang.length));
  var h=(D.hadiah||[]).length;$('#rR1').classList.toggle('hide',h<1);$('#rR2').classList.toggle('hide',h<2);
  var ak=D.akad||D.resepsi||{},ev2=D.resepsi||D.akad||{};
  $('#pvI').src=BASEURL+'foto/og.jpg';$('#pvT').textContent='Undangan Pernikahan '+NAMA;
  $('#pvD').textContent='Kami mengundang Anda ke pernikahan '+NAMA+' - '+tgl(ak.tanggal)+' di '+(ev2.tempat||'')+'.';
}
$('#psR').onclick=function(){$('#ps').value=DEFAULT};
$('#setS').onclick=function(){
  var p=$('#ps').value.trim();
  var o={ucapanPublik:$('#cUp').checked,turutTampil:$('#cTm').checked,rekening1:$('#cR1').checked,rekening2:$('#cR2').checked,pesan:p===DEFAULT?'':p};
  FB.simpanPengaturan(o).then(function(){
    S.set=o;
    return FB.pengaturan().catch(function(){return null});
  }).then(function(p){
    var cocok=p&&p.ucapanPublik===o.ucapanPublik&&p.turutTampil===o.turutTampil&&p.rekening1===o.rekening1&&p.rekening2===o.rekening2;
    toast(cocok?'Pengaturan disimpan dan sudah aktif di undangan':'Tersimpan, tetapi belum terbaca oleh halaman tamu. Periksa Rules Firebase (Tahap 6D).');
  }).catch(gagal);
};
$('#out').onclick=function(){FB.logout();location.reload()};
})();
</script>
</body>
</html>
